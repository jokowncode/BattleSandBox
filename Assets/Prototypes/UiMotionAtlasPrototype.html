<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI 动效图谱 · Throwaway</title><style>
:root{--bg:#080a0b;--p:#15191a;--e:#fff0b7;--g:#eec668;--c:#62dfd8;--r:#ff6f78;--t:#f8f0d8;--m:#9ba09a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#263536 0,#090b0d 45%,#040506 100%);color:var(--t);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1280px;margin:auto;padding:30px 22px 110px}.ey{color:var(--g);font-size:11px;letter-spacing:.16em}h1{margin:4px 0;font-size:30px}.lead{margin:0 0 18px;color:var(--m)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{min-height:204px;padding:13px;overflow:hidden;position:relative;background:linear-gradient(135deg,#1a1e1f,#101213);border:2px solid var(--e);clip-path:polygon(0 0,96% 0,100% 8%,100% 100%,4% 100%,0 92%);box-shadow:0 10px 24px #0008}.card:before{content:"";position:absolute;inset:7px;border:1px solid #eec66866;pointer-events:none}.card h3{margin:0;font-size:14px}.card p{margin:4px 0 11px;color:var(--m);font-size:12px}.stage{height:110px;display:grid;place-items:center;position:relative;overflow:hidden;background:#080a0b;border:1px solid #81775e}.sample{position:relative}.replay{position:absolute;right:12px;bottom:10px;border:1px solid #928461;background:#252b2b;color:var(--t);padding:5px 9px;cursor:pointer}.replay:hover{border-color:var(--c)}.btn{padding:10px 16px;color:#171714;background:linear-gradient(90deg,#e7bf62,#fff1ba);border:0;font-weight:800;clip-path:polygon(0 0,93% 0,100% 24%,100% 100%,7% 100%,0 76%)}.panel{width:190px;padding:12px;background:#202526;border:1px solid var(--e);clip-path:polygon(0 0,92% 0,100% 16%,100% 100%,8% 100%,0 84%)}.panel b{color:var(--g)}.toast{padding:8px 13px;background:#e9ce7d;color:#171817;font-weight:800;border-left:4px solid var(--c)}.bar{width:175px;height:10px;background:#050606;border:1px solid #867b5f}.bar i{display:block;height:100%;width:30%;background:var(--c)}.badge{padding:7px 11px;color:#ffb8bd;border:1px solid var(--r);background:#371b20}.tabs{display:flex;gap:12px;border-bottom:1px solid #8e805f}.tabs b{padding:5px 2px;color:var(--m)}.tabs b:last-child{color:var(--t);border-bottom:3px solid var(--g)}.toggle{width:56px;height:27px;border-radius:20px;background:#555;border:1px solid #aaa}.toggle i{display:block;width:21px;height:21px;margin:2px;border-radius:50%;background:#ddd}.input{width:175px;padding:8px;background:#0b0d0e;border:1px solid #81775e;color:var(--t)}.spinner{width:42px;height:42px;border:4px solid #564d38;border-top-color:var(--g);border-radius:50%}.dots i{display:inline-block;width:9px;height:9px;margin:4px;border-radius:50%;background:var(--g)}.screen{width:210px;height:82px;padding:11px;background:#1d2223;border:1px solid var(--e);text-align:center}.loot i{font-style:normal;margin:4px;padding:7px;border:1px solid var(--g);color:var(--g)}
/* motions */.fade.play{animation:fade .42s both}.up.play{animation:up .46s cubic-bezier(.18,.9,.24,1) both}.down.play{animation:down .46s cubic-bezier(.18,.9,.24,1) both}.left.play{animation:left .46s cubic-bezier(.18,.9,.24,1) both}.right.play{animation:right .46s cubic-bezier(.18,.9,.24,1) both}.pop.play{animation:pop .42s cubic-bezier(.18,1.25,.35,1) both}.elastic.play{animation:elastic .65s both}.scan.play:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,#fff7d288 50%,transparent 62%);animation:scan .55s}.exit.play{animation:exit .52s both}.shake.play{animation:shake .38s}.fold.play{transform-origin:top;animation:fold .45s both}.zoom.play{animation:zoom .45s cubic-bezier(.2,.9,.3,1) both}.flip.play{animation:flip .58s both}.dim.play:before{content:"";position:absolute;inset:-40px;background:#000;z-index:-1;animation:dim .4s both}.drag{cursor:grab;touch-action:none}.drag:active{cursor:grabbing}.count.play{animation:count .45s}.fill.play i{animation:fill .7s cubic-bezier(.2,.9,.2,1) forwards}.alert.play{animation:alert .58s}.tip.play{animation:tip .35s both}.cascade.play i{display:inline-block;animation:cascade .45s both}.cascade.play i:nth-child(2){animation-delay:.1s}.cascade.play i:nth-child(3){animation-delay:.2s}.switch.play i{animation:switch .35s forwards}.underline.play b:last-child{animation:uline .38s}.check.play{animation:check .42s}.slider.play:after{content:"";width:17px;height:17px;border-radius:50%;background:var(--g);display:block;animation:slider .55s forwards}.dropdown.play{animation:drop .4s both}.focus.play{animation:focus .36s forwards}.marker.play{animation:marker .55s}.radial.play{animation:radial .48s both}.wipe.play{animation:wipe .55s both}.glitch.play{animation:glitch .42s}.spin.play{animation:spin .75s linear}.dots.play i{animation:dots .8s infinite}.skeleton.play{animation:skeleton 1s infinite}.stamp.play{animation:stamp .48s cubic-bezier(.2,1.2,.3,1) both}.countdown.play{animation:countdown .58s both}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1}}@keyframes down{from{opacity:0;transform:translateY(-35px)}to{opacity:1}}@keyframes left{from{opacity:0;transform:translateX(-130px)}to{opacity:1}}@keyframes right{from{opacity:0;transform:translateX(130px)}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}@keyframes elastic{0%{transform:scale(.4)}55%{transform:scale(1.16)}72%{transform:scale(.93)}100%{transform:scale(1)}}@keyframes scan{from{transform:translateX(-130%)}to{transform:translateX(130%)}}@keyframes exit{to{opacity:0;transform:translateX(100px) scale(.9)}}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}@keyframes fold{from{opacity:0;transform:scaleY(.04)}to{opacity:1}}@keyframes zoom{from{opacity:0;transform:scale(.72)}to{opacity:1}}@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{opacity:1}}@keyframes dim{to{opacity:.62}}@keyframes count{45%{transform:scale(1.28);color:#fff5b7}}@keyframes fill{to{width:88%}}@keyframes alert{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px);filter:brightness(1.8)}}@keyframes tip{from{opacity:0;transform:translateY(10px) scale(.8)}to{opacity:1}}@keyframes cascade{from{opacity:0;transform:translateY(18px)}to{opacity:1}}@keyframes switch{to{transform:translateX(28px);background:var(--c)}}@keyframes uline{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}@keyframes check{50%{transform:scale(1.18);filter:brightness(1.7)}}@keyframes slider{to{transform:translateX(120px)}}@keyframes drop{from{opacity:0;transform:translateY(-25px)}to{opacity:1}}@keyframes focus{to{border-color:var(--c);box-shadow:0 0 12px #62dfd866}}@keyframes marker{50%{transform:translateY(-20px) scale(1.25)}to{transform:none}}@keyframes radial{from{transform:scale(.2) rotate(-90deg);opacity:0}to{opacity:1}}@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}@keyframes glitch{25%{transform:translate(5px,-2px);filter:hue-rotate(50deg)}50%{transform:translate(-4px,2px)}to{transform:none}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dots{50%{transform:translateY(-9px);opacity:.4}}@keyframes skeleton{50%{opacity:.25}}@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-10deg)}to{opacity:1}}@keyframes countdown{50%{transform:scale(1.5);color:var(--r)}}
.switcher{position:fixed;bottom:15px;left:50%;z-index:5;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px;background:#101516;border:1px solid var(--e)}.switcher button{padding:5px 10px;background:#283031;color:var(--t);border:1px solid var(--e);cursor:pointer}.switcher strong{min-width:170px;text-align:center;font-size:12px}.state{position:fixed;right:15px;bottom:15px;padding:8px 11px;border-left:3px solid var(--c);background:#101516df;color:var(--m);font-size:12px}@media(max-width:840px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:24px 14px 100px}.state{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="ey">THROWAWAY UI MOTION ATLAS · 5 CATEGORIES / 60 MICRO PROTOTYPES</div><h1>科幻 UI 动效图谱</h1><p class="lead">五类、共六十个可重播小样。建议同一界面只选一种“出现逻辑”、一种“确认逻辑”和一种“警示逻辑”，避免动效彼此竞争。</p><section id="app"></section></main><div class="state">状态：<span id="state">按钮与 CTA</span></div><nav class="switcher"><button id="prev">←</button><strong id="label"></strong><button id="next">→</button></nav><script>
const cats={A:['按钮与 CTA',[['直接闪现','m-instant','btn fade'],['淡入上浮','m-fade','btn up'],['左侧飞入','m-left','btn left'],['右侧飞入','m-right','btn right'],['缩放弹出','m-pop','btn pop'],['弹性落位','m-elastic','btn elastic'],['扫光可用','m-scan','btn scan'],['点击压下','m-click','btn pop'],['完成退出','m-exit','btn exit'],['禁用抖动','m-disabled','btn shake'],['长按确认','m-hold','bar fill'],['成功变色','m-success','btn count']]],B:['面板与弹窗',[['直接打开','p-instant','panel fade'],['渐显聚焦','p-fade','panel fade'],['顶部下落','p-top','panel down'],['底部升起','p-bottom','panel up'],['左侧抽屉','p-left','panel left'],['右侧抽屉','p-right','panel right'],['折叠展开','p-fold','panel fold'],['中心缩放','p-zoom','panel zoom'],['翻转切换','p-flip','panel flip'],['背景遮罩','p-dim','panel dim'],['错误震动','p-shake','panel shake'],['可拖动窗','p-drag','panel drag']]],C:['反馈与数据',[['顶部提示条','f-toast','toast down'],['工具提示','f-tip','toast tip'],['页签下划线','f-tabs','tabs underline'],['数值跳变','f-number','badge count'],['经验条填充','f-bar','bar fill'],['警报徽记','f-alert','badge alert'],['奖励错峰','f-loot','loot cascade'],['血条闪烁','f-health','bar alert'],['资源拾取','f-pickup','badge up'],['红点出现','f-badge','badge pop'],['成就盖章','f-stamp','badge stamp'],['倒数强调','f-countdown','badge countdown']]],D:['输入与导航',[['开关切换','n-switch','toggle switch'],['勾选确认','n-check','badge check'],['滑杆移动','n-slider','bar slider'],['下拉展开','n-dropdown','panel dropdown'],['输入框聚焦','n-focus','input focus'],['卡片选中','n-select','panel pop'],['地图标记','n-marker','badge marker'],['径向菜单','n-radial','badge radial'],['分页切换','n-page','tabs left'],['滚动定位','n-scroll','bar fill'],['拖拽槽位','n-drag','panel drag'],['光标提示','n-cursor','badge tip']]],E:['全屏与加载',[['场景淡出','s-fade','screen fade'],['侧向擦除','s-wipe','screen wipe'],['故障切换','s-glitch','screen glitch'],['加载旋环','s-spin','spinner spin'],['加载点','s-dots','dots dots'],['骨架屏','s-skeleton','screen skeleton'],['进度填充','s-progress','bar fill'],['章节卡片','s-card','screen up'],['胜利印章','s-stamp','badge stamp'],['暂停遮罩','s-dim','screen dim'],['开始倒数','s-count','badge countdown'],['错误重试','s-alert','screen shake']]]};const order=Object.keys(cats);let v=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();if(!cats[v])v='A';
function inner(kind,label){if(kind.includes('btn'))return `<button class="${kind}">${label}</button>`;if(kind.includes('panel'))return `<div class="${kind}"><b>${label}</b><br><small>模块数据已同步</small></div>`;if(kind.includes('bar'))return `<div class="${kind}"><i></i></div>`;if(kind.includes('tabs'))return `<div class="${kind}"><b>信息</b><b>模块</b><b>装备</b></div>`;if(kind.includes('toggle'))return `<div class="${kind}"><i></i></div>`;if(kind.includes('input'))return `<div class="${kind}">输入指令…</div>`;if(kind.includes('spinner'))return `<div class="${kind}"></div>`;if(kind.includes('dots'))return `<div class="${kind}"><i></i><i></i><i></i></div>`;if(kind.includes('loot'))return `<div class="${kind}"><i>物资</i><i>词条</i><i>经验</i></div>`;return `<div class="${kind}">${label}</div>`}
function render(){const [name,items]=cats[v];document.querySelector('#app').innerHTML=`<h2>${name} · ${items.length} 种</h2><div class="grid">${items.map(([title,id,kind])=>`<article class="card"><h3>${title}</h3><p>${desc(title)}</p><div class="stage"><div class="sample ${kind}" data-id="${id}">${inner(kind,title)}</div></div><button class="replay">重播</button></article>`).join('')}</div>`;document.querySelector('#label').textContent=`${v} · ${name}`;document.querySelector('#state').textContent=`${name} / 等待重播`;history.replaceState(null,'',`${location.pathname}?variant=${v}`);document.querySelectorAll('.replay').forEach(b=>b.onclick=()=>play(b.parentElement));document.querySelectorAll('.drag').forEach(enableDrag)}function desc(t){return t.includes('警报')||t.includes('错误')?'只在状态变化时播放一次。':t.includes('加载')||t.includes('进度')?'持续类效果应低频、可中断。':t.includes('拖')?'按住样例后可拖动。':'点击重播，比较它与其他进入方式。'}function play(card){const s=card.querySelector('.sample'),id=s.dataset.id;s.classList.remove('play');void s.offsetWidth;s.classList.add('play');document.querySelector('#state').textContent=`${cats[v][0]} / ${card.querySelector('h3').textContent}`;setTimeout(()=>s.classList.remove('play'),1000)}function enableDrag(el){let x,y,dx=0,dy=0;el.onpointerdown=e=>{x=e.clientX;y=e.clientY;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(x==null)return;dx+=e.clientX-x;dy+=e.clientY-y;x=e.clientX;y=e.clientY;el.style.transform=`translate(${dx}px,${dy}px)`};el.onpointerup=()=>x=null}function show(n){v=n;render()}document.querySelector('#prev').onclick=()=>show(order[(order.indexOf(v)+order.length-1)%order.length]);document.querySelector('#next').onclick=()=>show(order[(order.indexOf(v)+1)%order.length]);document.onkeydown=e=>{if(e.key==='ArrowLeft')document.querySelector('#prev').click();if(e.key==='ArrowRight')document.querySelector('#next').click()};render();
</script></body></html>
